# Financial AI Platform - Docker Compose Configuration
# Orchestrates all containers: Frontend, Backend, MongoDB, Ollama, and Ollama-Init

services:
  # MongoDB Database - Stores chat history and user context
  mongodb:
    image: mongo:7.0
    container_name: financial-ai-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      - financial-ai-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Ollama AI Engine - Runs local LLM
  ai-engine:
    image: ollama/ollama:latest
    container_name: financial-ai-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"  # Exposed for model inspection and API access
    networks:
      - financial-ai-network
    environment:
      - OLLAMA_HOST=0.0.0.0
    command: "serve"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Ollama Model Provisioner - Automatically pulls the configured model on startup if not present
  ollama-init:
    image: ollama/ollama:latest
    container_name: financial-ai-ollama-init
    networks:
      - financial-ai-network
    environment:
      - OLLAMA_HOST=ai-engine:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:1.5b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Verifying connection to Ollama engine..."
        until ollama list > /dev/null 2>&1; do
          sleep 2
        done
        echo "Ensuring model $$OLLAMA_MODEL is downloaded..."
        ollama pull $$OLLAMA_MODEL
        echo "Model $$OLLAMA_MODEL ready!"
    depends_on:
      ai-engine:
        condition: service_healthy
    restart: "no"

  # FastAPI Backend - API routing, AI agent, data fetching
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: financial-ai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"  # Exposed for API access and Swagger docs
    environment:
      - MONGODB_URL=${MONGODB_URL:-mongodb://mongodb:27017}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-financial_ai}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ai-engine:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:1.5b}
    depends_on:
      mongodb:
        condition: service_healthy
      ai-engine:
        condition: service_healthy
    networks:
      - financial-ai-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 30s

  # React Frontend (Vite) - User interface
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: financial-ai-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"  # Exposed for web browser access
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000/api}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - financial-ai-network

# Named volumes for persistent data
volumes:
  mongodb_data:
    driver: local
  ollama_data:
    driver: local

# Internal Docker network for container communication
networks:
  financial-ai-network:
    driver: bridge
